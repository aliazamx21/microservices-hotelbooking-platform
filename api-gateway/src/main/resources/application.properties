spring.application.name=api-gateway
server.port=6969

# ==========================================
# SECURITY & IDENTITY
# ==========================================
jwt.secret=${JWT_SECRET:fallback-secret-key-for-local-development-only-12345}

# ==========================================
# EUREKA & SPRING BOOT ADMIN REGISTRATION
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

spring.boot.admin.client.instance.service-url=http://api-gateway:6969
spring.boot.admin.client.url=http://spring-boot-admin-service:8087

# ==========================================
# SPRING CLOUD GATEWAY ROUTES (Hotel Booking)
# ==========================================
spring.cloud.gateway.routes[0].id=property-service
spring.cloud.gateway.routes[0].uri=http://propertyservice:1116
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/property/**

spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=http://bookingservice:1112
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/booking/**

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=http://paymentservice:1115
spring.cloud.gateway.routes[2].predicates[0]=Path=/product/v1/**

spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://authservice:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/auth/**

# ==========================================
# OBSERVABILITY & MANAGEMENT (Actuator & Zipkin)
# ==========================================
management.server.port=6969
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=DEBUG