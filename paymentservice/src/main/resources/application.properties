spring.application.name=paymentservice
server.port=1115

# ==========================================
# STRIPE API KEYS
# ==========================================
stripe.secretKey=${STRIPE_SECRET_KEY:sk_test_mock_key_for_local_dev}

# ==========================================
# KAFKA CONFIGURATION
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# EUREKA & SPRING BOOT ADMIN REGISTRATION
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

spring.boot.admin.client.instance.service-url=http://paymentservice:1115
spring.boot.admin.client.url=http://spring-boot-admin-service:8087

# ==========================================
# OBSERVABILITY & MANAGEMENT
# ==========================================
management.server.port=1115
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
management.prometheus.metrics.export.enabled=true