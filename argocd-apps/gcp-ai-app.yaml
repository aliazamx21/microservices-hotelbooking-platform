apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-ai-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/aliazamx21/microservices-hotelbooking-platform.git'
    targetRevision: HEAD
    path: k8s/gcp
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true