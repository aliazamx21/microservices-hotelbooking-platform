spring.application.name=propertyservice
server.port=1116

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/propertyservicedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow Circular References (As per your original code)
spring.main.allow-circular-references=true

# ==========================================
# AWS S3 CONFIGURATION
# ==========================================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:hotelbooking-property-images-local}
cloud.aws.region.static=${AWS_REGION:ap-south-1}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:mock_access_key}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:mock_secret_key}

# Multipart Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# KAFKA CONFIGURATION
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ==========================================
# EUREKA & SPRING BOOT ADMIN REGISTRATION
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

spring.boot.admin.client.instance.service-url=http://propertyservice:1116
spring.boot.admin.client.url=http://spring-boot-admin-service:8087

# ==========================================
# OBSERVABILITY & MANAGEMENT
# ==========================================
management.server.port=1116
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
management.prometheus.metrics.export.enabled=true