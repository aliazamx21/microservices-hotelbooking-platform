name: "04 - Azure Infrastructure"
on:
  push:
    branches: [ main ]
    paths: [ 'terraform/azure/**' ]
  workflow_dispatch:

jobs:
  azure-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply Azure
        run: |
          cd terraform/azure
          terraform init
          terraform apply -auto-approve

      - name: Configure AKS Context & Secrets
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'hotel-devops-rg'
          cluster-name: 'hotel-devops-aks'

      - name: Bootstrap ArgoCD & Register Azure DevOps App
        run: |
          # Docker Hub Image Pull Secret
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Install ArgoCD & Register App
          kubectl create namespace argocd || true
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=established --timeout=60s crd/applications.argoproj.io || sleep 10
          kubectl apply -f azure-devops-app.yaml