name: "01 - AWS Infrastructure"
on:
  push:
    branches: [ main ]
    paths: [ 'terraform/aws/**' ]
  workflow_dispatch:

jobs:
  aws-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
      - run: |
          cd terraform/aws
          terraform init
          terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"
      - run: aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster
      - run: |
          cd terraform/aws
          kubectl create configmap infra-config --from-literal=DB_ENDPOINT=$(terraform output -raw rds_endpoint) --from-literal=S3_BUCKET_NAME=$(terraform output -raw s3_bucket_name) -o yaml --dry-run=client | kubectl apply -f -
          kubectl create secret generic hotelbooking-secrets --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" --dry-run=client -o yaml | kubectl apply -f -