name: "02 - AWS Microservices CI"
on:
  push:
    branches: [ main ]
    paths:
      - 'api-gateway/**'
      - 'authservice/**'
      - 'bookingservice/**'
      - 'paymentservice/**'
      - 'propertyservice/**'
  workflow_dispatch:

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, Push, and Update YAMLs
        run: |
          SERVICES=("api-gateway" "authservice" "bookingservice" "paymentservice" "propertyservice")
          
          for service in "${SERVICES[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^$service/"; then
              echo "Building $service..."
              mvn -f "$service/pom.xml" clean package -DskipTests
              IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/hotelbooking-platform:$service-${{ github.sha }}"
              docker build -t "$IMAGE_TAG" "$service"
              docker push "$IMAGE_TAG"
              sed -i "s|image: .*/hotelbooking-platform:$service.*|image: $IMAGE_TAG|g" k8s/aws/$service.yaml
            fi
          done

      - name: Commit GitOps Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/aws/
          git commit -m "GitOps: Update AWS image tags to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main