name: 4-ai-services-deploy

on:
  workflow_run:
    workflows: ["3-microservices-deploy"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'ai-mcp-client/**'
      - 'ai-mcp-sandbox/**'
      - 'k8s/ai/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        service:
          - name: ai-mcp-client
            dir: ai-mcp-client
          - name: ai-mcp-sandbox
            dir: ai-mcp-sandbox
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          SERVICE_PATH="${{ matrix.service.dir }}"
          [ -f "$SERVICE_PATH/pom.xml" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          mvn -f "$SERVICE_PATH/pom.xml" clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          SERVICE_PATH="${{ matrix.service.dir }}"
          [ -f "$SERVICE_PATH/Dockerfile" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest"

          docker build -t "$IMAGE_TAG" "$SERVICE_PATH"
          docker push "$IMAGE_TAG"

  deploy-to-gke:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Deploy Manifests to GKE
        run: |
          gcloud container clusters get-credentials ai-mcp-cluster --region asia-south1
          kubectl apply -f k8s/ai/ai-services.yaml
          kubectl rollout restart deployment ai-mcp-client
          kubectl rollout restart deployment ai-mcp-sandbox