name: "07 - Destroy All Infrastructure"
on:
  workflow_dispatch:

jobs:
  destroy-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 1. DELETE K8S LOAD BALANCERS FIRST (Prevents Cloud VPC teardown blocks)
      - name: Clean LoadBalancers Before Teardown
        run: |
          az aks get-credentials --resource-group hotel-devops-rg --name hotel-devops-aks || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true
          aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true
          gcloud container clusters get-credentials ai-mcp-cluster --region asia-south1 || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true

      - uses: hashicorp/setup-terraform@v3

      # 2. DESTROY TERRAFORM INFRASTRUCTURE ACROSS ALL CLOUDS
      - name: Destroy Azure Infrastructure
        if: always()
        run: |
          cd terraform/azure
          terraform init
          terraform destroy -auto-approve

      - name: Destroy AWS Infrastructure
        if: always()
        run: |
          cd terraform/aws
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Destroy GCP Infrastructure
        if: always()
        run: |
          cd terraform/gcp
          terraform init
          terraform destroy -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"

      # 3. CLEAN UP PERSONAL DOCKER HUB REPOSITORY
      - name: Delete Hotel Booking Docker Hub Repository
        if: always()
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ]; then
            curl -s -o /dev/null -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/hotelbooking-platform/"
            echo "Docker Hub repository cleaned successfully."
          fi