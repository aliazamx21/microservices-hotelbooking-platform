name: 3-microservices-deploy

on:
  workflow_run:
    workflows: ["2-devops-tools"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'api-gateway/**'
      - 'authservice/**'
      - 'bookingservice/**'
      - 'paymentservice/**'
      - 'propertyservice/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    outputs:
      changed_services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for modified files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            authservice: 'authservice/**'
            bookingservice: 'bookingservice/**'
            paymentservice: 'paymentservice/**'
            propertyservice: 'propertyservice/**'

  build-and-deploy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed_services != '[]' && needs.detect-changes.outputs.changed_services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_name: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          SERVICE_PATH="${{ matrix.service_name }}"
          [ -f "$SERVICE_PATH/pom.xml" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          mvn -f "$SERVICE_PATH/pom.xml" clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          SERVICE_PATH="${{ matrix.service_name }}"
          [ -f "$SERVICE_PATH/Dockerfile" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/hotelbooking-platform:${{ matrix.service_name }}"
          
          docker build -t "$IMAGE_TAG" "$SERVICE_PATH"
          docker push "$IMAGE_TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig & Deploy to EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster
          kubectl apply -f k8s/microservices/${{ matrix.service_name }}.yaml
          kubectl rollout restart deployment ${{ matrix.service_name }}-deployment || true