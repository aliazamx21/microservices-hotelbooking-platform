name: "09 - Destroy GCP Infrastructure"
on:
  workflow_dispatch:

jobs:
  destroy-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'ai-mcp-cluster'
          location: 'asia-south1'
        continue-on-error: true

      # 1. Clean LoadBalancers and Persistent Volumes to unblock VPC teardown and prevent orphaned disks
      - name: Clean GCP Resources
        continue-on-error: true
        run: |
          kubectl delete svc --all --all-namespaces --ignore-not-found=true || true
          kubectl delete pvc --all --all-namespaces --ignore-not-found=true || true

      # 2. Destroy GCP Infrastructure
      - name: Destroy GCP Infrastructure
        if: always()
        run: |
          cd terraform/gcp
          terraform init
          terraform destroy -auto-approve -lock=false -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"