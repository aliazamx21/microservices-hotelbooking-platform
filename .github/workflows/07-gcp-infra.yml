name: "07 - GCP Infrastructure"
on:
  push:
    branches: [ main ]
    paths: [ 'terraform/gcp/**' ]
  workflow_dispatch:

jobs:
  gcp-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply GCP
        run: |
          cd terraform/gcp
          terraform init
          terraform apply -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'ai-mcp-cluster'
          location: 'asia-south1'

      - name: Create Secrets and Deploy GCP AI Workloads
        run: |
          # 1. Create Gemini API Secret
          kubectl create secret generic ai-secrets \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Create Docker Hub Pull Secret
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 3. Apply GCP AI Manifests
          kubectl apply -f k8s/gcp/