name: "07 - GCP Infrastructure"
on:
  push:
    branches: [ main ]
    paths: [ 'terraform/gcp/**' ]
  workflow_dispatch:

jobs:
  gcp-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply GCP
        run: |
          cd terraform/gcp
          terraform init
          terraform apply -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'ai-mcp-cluster'
          location: 'asia-south1'

      - name: Bootstrap ArgoCD & Register GCP AI App
        run: |
          # 1. Create Secrets in Default Namespace
          kubectl create secret generic ai-secrets \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Install ArgoCD
          kubectl create namespace argocd || true
          kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          # 3. Wait for ArgoCD CRD
          kubectl wait --for=condition=established --timeout=60s crd/applications.argoproj.io || sleep 10

          # 4. Register the GCP AI Application
          kubectl apply -f gcp-ai-app.yaml