name: "10 - Destroy All Infrastructure"
on:
  workflow_dispatch:

jobs:
  destroy-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: 'ai-mcp-cluster'
          location: 'asia-south1'
        continue-on-error: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 1. CLEAN UP LOAD BALANCERS FIRST (Unblocks cloud VPC deletions)
      - name: Clean Azure LoadBalancers
        if: always()
        continue-on-error: true
        run: |
          az aks get-credentials --resource-group hotel-devops-rg --name hotel-devops-aks || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true || true

      - name: Clean AWS LoadBalancers
        if: always()
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true || true

      - name: Clean GCP LoadBalancers
        if: always()
        continue-on-error: true
        run: |
          kubectl delete svc --all --all-namespaces --ignore-not-found=true || true

      # 2. DESTROY TERRAFORM INFRASTRUCTURE ACROSS ALL CLOUDS
      - name: Destroy Azure Infrastructure
        if: always()
        run: |
          cd terraform/azure
          terraform init
          terraform destroy -auto-approve

      - name: Destroy AWS Infrastructure
        if: always()
        run: |
          cd terraform/aws
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Destroy GCP Infrastructure
        if: always()
        run: |
          cd terraform/gcp
          terraform init
          terraform destroy -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"

      # 3. CLEAN UP PERSONAL DOCKER HUB REPOSITORIES
      - name: Delete Hotel Booking Docker Hub Repositories
        if: always()
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ]; then
            REPOS=("hotelbooking-platform" "ai-mcp-client" "ai-mcp-sandbox" "eureka-server" "admin-server")
            for repo in "${REPOS[@]}"; do
              curl -s -o /dev/null -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${repo}/" || true
            done
            echo "Docker Hub repositories cleanup attempted."
          fi