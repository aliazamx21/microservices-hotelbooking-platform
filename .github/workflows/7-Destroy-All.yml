name: 7-Destroy-All
on:
  workflow_dispatch:

jobs:
  destroy-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Clean LoadBalancers Before Teardown
        run: |
          az aks get-credentials --resource-group hotel-devops-rg --name hotel-devops-aks || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true
          aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true
          gcloud container clusters get-credentials ai-mcp-cluster --region asia-south1 || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true

      - uses: hashicorp/setup-terraform@v3

      - name: Destroy Azure
        if: always()
        run: |
          cd terraform/azure
          terraform init
          terraform destroy -auto-approve

      - name: Destroy AWS
        if: always()
        run: |
          cd terraform/aws
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Destroy GCP
        if: always()
        run: |
          cd terraform/gcp
          terraform init
          terraform destroy -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"