name: Destroy Infrastructure and Images

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --- 1. CLEAN UP UNTRACKED KUBERNETES RESOURCES ---
      - name: Clean up EKS Resources (LoadBalancers & Volumes)
        run: |
          if aws eks update-kubeconfig --region ap-south-1 --name hotelbooking-cluster > /dev/null 2>&1; then
            echo "EKS Cluster found. Tearing down K8s services to release AWS network resources..."
          
            kubectl delete svc --all --all-namespaces --ignore-not-found=true
            kubectl delete ingress --all --all-namespaces --ignore-not-found=true
            kubectl delete pvc --all --all-namespaces --ignore-not-found=true
          
            echo "Waiting 90 seconds for AWS to detach ENIs and delete K8s ELBs..."
            sleep 90
          else
            echo "EKS Cluster not found or already deleted. Skipping K8s cleanup."
          fi

      # --- 2. LET TERRAFORM DESTROY CLOUD RESOURCES ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      # --- 3. DELETE ONLY THE HOTEL BOOKING DOCKER REPOSITORY ---
      - name: Delete Hotel Booking Docker Repository
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Authenticating with Docker Hub..."
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to authenticate with Docker Hub. Check your credentials."
            exit 1
          fi
          
          echo "Deleting only the 'hotelbooking-platform' repository..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/hotelbooking-platform/")
          
          if [ "$RESPONSE" == "202" ] || [ "$RESPONSE" == "204" ] || [ "$RESPONSE" == "200" ]; then
            echo "✅ Docker Hub hotelbooking cleanup complete."
          elif [ "$RESPONSE" == "404" ]; then
            echo "✅ Repository already deleted or not found."
          else
            echo "⚠️ Failed to delete repository. HTTP Status: $RESPONSE"
          fi