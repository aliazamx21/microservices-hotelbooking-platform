spring.application.name=ai-mcp-sandbox
server.port=8080

# MCP Server
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=hotel-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.transport=webmvc

# Qdrant Vector DB
spring.ai.vectorstore.qdrant.host=qdrant-service
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=hotel_embeddings
spring.ai.vectorstore.qdrant.initialize-schema=false

# Actuator for ArgoCD Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always