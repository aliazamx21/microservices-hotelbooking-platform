spring.application.name=ai-mcp-sandbox
server.port=8080

# MCP Server WebMVC SSE Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=hotel-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.transport=webmvc
spring.ai.mcp.server.webmvc.sse-endpoint=/sse
spring.ai.mcp.server.webmvc.message-endpoint=/mcp/message

# Qdrant Vector DB Configuration
spring.ai.vectorstore.qdrant.host=qdrant-service
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=hotel_embeddings
spring.ai.vectorstore.qdrant.initialize-schema=true