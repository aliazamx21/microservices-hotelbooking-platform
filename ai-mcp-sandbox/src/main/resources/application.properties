spring.application.name=ai-mcp-sandbox
server.port=8080

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=hotel-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.transport=webmvc

# Qdrant Vector DB Configuration
spring.ai.vectorstore.qdrant.host=qdrant-service
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=hotel_embeddings
spring.ai.vectorstore.qdrant.initialize-schema=true

# Gemini via OpenAI Compatibility Interface
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.embedding.options.model=text-embedding-004