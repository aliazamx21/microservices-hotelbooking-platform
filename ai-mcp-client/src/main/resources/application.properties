spring.application.name=ai-mcp-client
server.port=8081

# Use SSE to match the MCP server protocol
spring.ai.mcp.client.sse.connections.hotelserver.url=http://ai-mcp-sandbox-service:8080/mcp
spring.ai.mcp.client.sse.connections.hotelserver.request-timeout=60s

# Google GenAI Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-1.5-flash