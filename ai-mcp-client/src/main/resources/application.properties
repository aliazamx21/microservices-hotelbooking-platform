spring.application.name=ai-mcp-client
server.port=8081

# MCP Client (Connecting via internal K8s DNS)
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=hotel-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.sse.connections.hotelserver.url=http://ai-mcp-sandbox-service:8080/sse

# Gemini OpenAI-Compatible Endpoint
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-1.5-flash

# Actuator for ArgoCD Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always