spring.application.name=ai-mcp-client
server.port=8081

# 1. Connect to the MCP Server you are currently running
spring.ai.mcp.client.streamable-http.connections.hotel-server.url=${SPRING_AI_MCP_CLIENT_STREAMABLE_HTTP_CONNECTIONS_HOTEL_SERVER_URL:http://localhost:8080}

# 2. Use the Environment Variable injected by Kubernetes/Docker
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# 3. Specify the current active 2026 model version
spring.ai.google.genai.chat.options.model=gemini-3.6-flash