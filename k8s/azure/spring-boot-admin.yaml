apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-admin-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-admin
  template:
    metadata:
      labels:
        app: spring-boot-admin
    spec:
      containers:
        - name: spring-boot-admin
          image: aliaz333/admin-server:latest
          ports:
            - containerPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-admin-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: spring-boot-admin
  ports:
    - protocol: TCP
      port: 8087
      targetPort: 8087