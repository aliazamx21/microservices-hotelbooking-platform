spring.application.name=authservice
server.port=8086

# ==========================================
# SECURITY & IDENTITY
# ==========================================
jwt.secret=${JWT_SECRET:fallback-secret-key-for-local-development-only-12345}

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# EUREKA & SPRING BOOT ADMIN REGISTRATION
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

spring.boot.admin.client.instance.service-url=http://authservice:8086
spring.boot.admin.client.url=http://spring-boot-admin-service:8087

# ==========================================
# OBSERVABILITY & MANAGEMENT
# ==========================================
management.server.port=8086
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true